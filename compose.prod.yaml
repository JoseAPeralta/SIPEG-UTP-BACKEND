name: sipeg-utp-prod

# Politica de imagenes (ADR-0007, seccion "Imagenes Fijadas"): toda imagen de
# terceros va con tag Y digest, `repo:tag@sha256:...`, nunca `latest`. El tag se
# lee, el digest fija. Actualizar una imagen exige editar las dos partes a la vez.
# La imagen de la API es la excepcion: se construye localmente, no admite digest,
# y por eso exige `IMAGE_TAG`. La tabla completa esta en
# docs/adr/adr-0007-structured-logging-and-observability.md.

# Spool local de logs (ADR-0007, seccion "Spool Local"). Sin esto el driver por
# defecto es `json-file` SIN opciones, que no rota nunca: si Loki o Alloy caen,
# Alloy reintenta para siempre (`max_backoff_retries = 0`) y el disco se llena.
#
# En produccion esto importa mas: el spool es lo unico que acota el disco cuando
# el colector esta caido, y `json-file` ademas frena al proceso al rotar.
# `max-size` y `max-file` son los defaults de `local`, declarados como politica.
# `docker compose logs` y la API de Docker que lee Alloy siguen funcionando.
x-logging: &logging
  driver: local
  options:
    max-size: '20m'
    max-file: '5'

services:
  migrate:
    build:
      context: .
      target: migrate
    image: sipeg-utp-backend:migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging
    security_opt:
      - no-new-privileges:true
    networks:
      - sipeg-utp-prod

  seed:
    build:
      context: .
      target: migrate
    image: sipeg-utp-backend:migrate
    entrypoint: ['pnpm', 'exec', 'tsx']
    command: ['prisma/seed.base.ts']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_IDENTIFICATION_NUMBER: ${SEED_ADMIN_IDENTIFICATION_NUMBER:-}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    logging: *logging
    security_opt:
      - no-new-privileges:true
    networks:
      - sipeg-utp-prod

  api:
    build:
      context: .
      target: runtime
    # OBLIGATORIA y sin default: `latest` hacia que un despliegue posterior
    # sobrescribiera sin querer la imagen que se verifico. La imagen se construye
    # localmente, asi que no admite digest (un digest solo existe en un registro):
    # el tag es el unico control de reproducibilidad aqui. Ver ADR-0007, IMP-003.
    image: sipeg-utp-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-9}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-7d}
      AUTH_REFRESH_COOKIE_SAME_SITE: "${AUTH_REFRESH_COOKIE_SAME_SITE:?Set it in production. Use lax or strict when the API and the frontend share a site, and none when they are on different sites.}"
      AUTH_EMAIL_VERIFICATION_URL: ${AUTH_EMAIL_VERIFICATION_URL:?AUTH_EMAIL_VERIFICATION_URL is required}
      AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:?AUTH_PASSWORD_RESET_URL is required}
      AUTH_EMAIL_VERIFICATION_TTL: ${AUTH_EMAIL_VERIFICATION_TTL:-24h}
      AUTH_PASSWORD_RESET_TTL: ${AUTH_PASSWORD_RESET_TTL:-1h}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-sipeg-utp-backend}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_PSEUDONYMIZATION_KEY: ${LOG_PSEUDONYMIZATION_KEY:?LOG_PSEUDONYMIZATION_KEY is required}
    ports:
      # Solo loopback. En produccion el unico cliente previsto es el proxy TLS del
      # host, que debe terminar HTTPS y reenviar aqui; publicar en 0.0.0.0
      # expondría la API en HTTP plano a toda la red. Ese proxy todavia no existe
      # en el repositorio: la brecha y sus condiciones estan en ADR-0007,
      # seccion "Puertos Publicados".
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - sipeg-utp-prod

  db:
    image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    networks:
      - sipeg-utp-prod

volumes:
  postgres_data:

networks:
  sipeg-utp-prod:
    driver: bridge
