# Telegraf para las metricas de Docker de SIPEG UTP.
#
# Habla con `docker-socket-proxy`, nunca con /var/run/docker.sock. El proxy solo
# permite GET/HEAD (POST=0), asi que Telegraf no puede mutar contenedores.
# Prometheus lo scrapea por la red `metrics` en telegraf:9273.
#
# Todas las series son de baja cardinalidad: dos proyectos, etiquetas Compose
# de proyecto/servicio y estados normalizados a numeros.

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  # Precision por defecto: Telegraf conserva el timestamp del evento.
  precision = "0s"
  flush_interval = "30s"
  flush_jitter = "0s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "tcp://docker-socket-proxy:2375"
  timeout = "5s"

  # Solo los contenedores de los proyectos Compose de SIPEG. El patron cubre
  # `sipeg-utp-prod-<servicio>-<indice>` y `sipeg-utp-dev-...`.
  container_name_include = ["sipeg-utp-prod-*", "sipeg-utp-dev-*"]
  # Los one-shot de migracion y seed no son servicios permanentes: no deben
  # aparecer como contenedores caidos despues de terminar con exito.
  container_name_exclude = ["*migrate*", "*seed*"]

  # Incluir estados no running evita que una caida desaparezca del scrape en
  # cuanto el contenedor deja de correr. `removing` es transitorio y se omite.
  container_state_include = [
    "running",
    "restarting",
    "exited",
    "created",
    "paused",
    "dead",
  ]

  # Acumulados por contenedor (cpu-total, device=total, network=total).
  # Sin perdevice_include no se generan series por CPU, dispositivo o interfaz.
  total_include = ["cpu", "blkio", "network"]
  perdevice_include = []

  # Sin consultas de uso de disco: evita cardinalidad y llamadas costosas.
  storage_objects = []

  # Allowlist de etiquetas Compose; se renombran a `project` y `service` mas
  # abajo. No se usan variables de entorno como etiquetas.
  docker_label_include = [
    "com.docker.compose.project",
    "com.docker.compose.service",
  ]
  tag_env = []
  source_tag = false

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "com.docker.compose.project"
    dest = "project"
  [[processors.rename.replace]]
    tag = "com.docker.compose.service"
    dest = "service"

# `processors.fielddrop` ya no existe en Telegraf 1.40.2; este script Starlark
# es el equivalente funcional y elimina los campos de todos los measurements
# donde aparezcan. Tambien normaliza `container_status` a `state_code` porque
# `processors.enum` escribe un tag cuando la origen es un tag; aqui se necesita
# un field numerico.
[[processors.starlark]]
  source = '''
STATE_CODES = {
    "created": 0,
    "running": 1,
    "paused": 2,
    "restarting": 3,
    "removing": 4,
    "exited": 5,
    "dead": 6,
}

FIELDS_TO_DROP = [
    "container_id",
    "pid",
    "started_at",
    "finished_at",
]


def apply(metric):
    if metric.name == "docker_container_status" and "container_status" in metric.tags:
        metric.fields["state_code"] = STATE_CODES.get(metric.tags["container_status"], 7)

    # La salida prometheus_client ignora los fields booleanos; se publica como 0/1.
    if "oomkilled" in metric.fields:
        metric.fields["oomkilled"] = 1 if metric.fields["oomkilled"] else 0

    for field in FIELDS_TO_DROP:
        if field in metric.fields:
            metric.fields.pop(field)

    return metric
'''

[[processors.enum]]
  [[processors.enum.mapping]]
    fields = ["health_status"]
    dest = "health_code"
    default = 4
    [processors.enum.mapping.value_mappings]
      starting = 0
      healthy = 1
      unhealthy = 2
      none = 3

[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  # Una entrada que deja de refrescarse desaparece a los 90 s. Prometheus
  # scrapea cada 30 s, asi que una interrupcion de la entrada Docker se nota.
  expiration_interval = "90s"
  # Los campos string (health_status) no se convierten en labels.
  string_as_label = false
  collectors_exclude = ["gocollector", "process"]
