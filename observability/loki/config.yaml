# Loki monolitico (single binary) para SIPEG UTP.
#
# Imagen fijada: grafana/loki:3.7.8 (sin `latest`; ver docs/adr/adr-0007-structured-logging-and-observability.md).
# Invocacion esperada: -config.file=/etc/loki/config.yaml
# Desarrollo: observability/loki/config.dev.yaml (7 dias). Si cambias retencion o
# schema, cambia ambos archivos.
#
# Topologia: la API escribe JSON de una linea a stdout, Docker rota con el driver
# `local` (spool), Grafana Alloy descubre el contenedor y envía a Loki. Loki no
# tiene puerto publicado: la red interna de Compose es su frontera. Por eso
# `auth_enabled: false` (tenant único) es aceptable; Grafana exige autenticación
# propia (T9.4) y nadie consulta Loki directamente.

# Tenant unico. Si se activa, Alloy debe enviar X-Scope-OrgID (T9.2) y el
# datasource de Grafana debe definirlo (T9.4).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  grpc_server_max_concurrent_streams: 1000
  log_level: info

common:
  # Single binary: el anillo vive en memoria del propio proceso.
  instance_addr: 127.0.0.1
  # path_prefix deriva compactor/, wal/, rules-temp/ y tsdb-shipper-*.
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# `tsdb` + `v13` son obligatorios: `allow_structured_metadata` esta en true por
# defecto en 3.7 y Loki no arranca con otro schema. `index.period: 24h` es
# requisito del indice tsdb y tambien de la retencion.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Loki no borra nada por defecto: sin este bloque la retencion es inerte.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  # Obligatorio cuando retention_enabled es true.
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  # La API ya emite `level` como texto y Alloy lo promueve a etiqueta, asi que la
  # deteccion de Loki sobra: ignora campos JSON numericos y cae a un grep de
  # palabras, que etiquetaria mal (por ejemplo `auth.login.failed` como `error`).
  discover_log_levels: false
  # Loki discovers a `service_name` field and lo convierte en etiqueta. Aqui
  # duplicaria la etiqueta `service` que ya llega de la API (y para `db` o
  # `mailpit` inventaria un valor a partir del nombre del contenedor), asi que se
  # desactiva: cada etiqueta duplicada es un stream mas.
  discover_service_name: []
  # 30 dias para access/application/infrastructure.
  retention_period: 720h
  # 90 dias para seguridad. El selector depende de la etiqueta `log_type` que
  # Alloy deriva del campo `logType` del JSON (T9.2); si un stream no trae el
  # campo, cae en retention_period.
  retention_stream:
    - selector: '{log_type="security"}'
      priority: 1
      period: 2160h
  # Valores por default conservados a proposito, sin fijar:
  # ingestion_rate_mb 4 / ingestion_burst_size_mb 6 / max_streams_per_user 5000 /
  # reject_old_samples_max_age 1w. Calibrar con linea base real antes de tocarlos,
  # igual que los umbrales de alerta (T10.4).

# Loki no ejecuta reglas: las alertas son de Grafana (T10.4).
ruler:
  enable_api: false

# Sin telemetria hacia el exterior del host.
analytics:
  reporting_enabled: false
