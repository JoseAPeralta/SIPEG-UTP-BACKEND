# Loki monolitico para DESARROLLO.
#
# Derivado de observability/loki/config.yaml: se mantienen identicos schema,
# compactor, ring y rutas. Si cambias schema o retencion, cambia ambos archivos.
# Lo unico que se reduce es la ventana de retencion, porque el volumen de
# desarrollo se descarta (docker compose down -v).
#
# Invocacion esperada: -config.file=/etc/loki/config.dev.yaml

# Tenant unico, igual que produccion: la frontera es la red de Compose y este
# Loki tampoco tiene puerto publicado.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  grpc_server_max_concurrent_streams: 1000
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  # Ver observability/loki/config.yaml: la API emite `level` como texto y Alloy
  # lo promueve a etiqueta, asi que la deteccion de Loki solo aportaria una
  # clasificacion por palabras.
  discover_log_levels: false
  # Ver observability/loki/config.yaml: sin `service_name` detectado, para no
  # duplicar la etiqueta `service` de la API.
  discover_service_name: []
  # 7 dias en desarrollo, sin excepcion por tipo de log.
  retention_period: 168h
  retention_stream:
    - selector: '{log_type="security"}'
      priority: 1
      period: 168h

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
