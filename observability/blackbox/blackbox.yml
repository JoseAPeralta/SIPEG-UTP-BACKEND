modules:
  http_health_internal:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_ssl: true
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"success"\s*:\s*true'
        - '"status"\s*:\s*"ok"'

  http_health_internal_jwks:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_ssl: true
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"success"\s*:\s*true'
        - '"status"\s*:\s*"ok"'
        - '"authJwksReachable"\s*:\s*true'

  http_jwks_internal:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_ssl: true
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"keys"\s*:\s*\[\s*\{'

  http_grafana:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_ssl: true
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"database"\s*:\s*"ok"'

  https_health_public:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      tls_config:
        min_version: TLS12
      fail_if_body_not_matches_regexp:
        - '"success"\s*:\s*true'
        - '"status"\s*:\s*"ok"'
      fail_if_body_matches_regexp:
        - '<html'

  https_health_public_jwks:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      tls_config:
        min_version: TLS12
      fail_if_body_not_matches_regexp:
        - '"success"\s*:\s*true'
        - '"status"\s*:\s*"ok"'
        - '"authJwksReachable"\s*:\s*true'
      fail_if_body_matches_regexp:
        - '<html'

  https_jwks_public:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      tls_config:
        min_version: TLS12
      fail_if_body_not_matches_regexp:
        - '"keys"\s*:\s*\[\s*\{'
      fail_if_body_matches_regexp:
        - '<html'
