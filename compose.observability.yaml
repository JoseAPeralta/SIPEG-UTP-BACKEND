# Stack de observabilidad: Loki + docker-socket-proxy + Alloy + Grafana.
#
# Es un *overlay*: no define `name:` para heredar el proyecto del compose base y
# no toca los servicios de la aplicacion salvo para forzar JSON en desarrollo.
#
# Politica de imagenes (ADR-0007, IMP-003): toda imagen de terceros va con tag Y
# digest, `repo:tag@sha256:...`. El tag se lee, el digest fija: si alguien mueve
# un tag en el registro, lo que corre no cambia. Actualizar una imagen exige
# editar las dos partes a la vez. La tabla completa esta en el ADR-0007.
#
#   Desarrollo:
#     LOKI_CONFIG=config.dev.yaml \
#       docker compose -f compose.dev.yaml -f compose.observability.yaml up -d
#   Produccion (se une a compose.prod.yaml, .env.prod):
#     docker compose -f compose.prod.yaml -f compose.observability.yaml \
#       -f compose.cloudflare.yaml --env-file .env.prod up -d
#
# `LOKI_CONFIG` elige la ventana de retencion (168 h en dev, 720 h + 90 dias de
# seguridad en produccion). Ver observability/loki/.
#
# Ningun servicio de este archivo publica puertos al exterior salvo Grafana, que
# se ata a 127.0.0.1 (T9.4/T9.7). Loki queda solo en la red `observability` y
# nadie lo consulta directamente: Grafana llega a Loki por esa red. Alloy usa
# `observability` para enviar logs y `docker-api` para hablar con el proxy del
# socket. Telegraf usa `docker-api` para el mismo proxy y `metrics` para que
# Prometheus lo scrapee. Prometheus consulta sus fuentes por `metrics`;
# PostgreSQL Exporter usa ademas `postgres-metrics` para llegar a `db`.

# Spool local de logs (ADR-0007, seccion "Spool Local"). Se aplica tambien a este
# stack: Loki y Alloy escriben en disco sin limite si nadie los lee, y son
# precisamente los servicios cuyo fallo dispara la retencion de logs local. El
# servicio `api` del overlay NO lleva `logging` porque hereda el del compose base
# (los bloques de un overlay se fusionan; redeclararlo aqui seria redundante).
x-logging: &logging
  driver: local
  options:
    max-size: '20m'
    max-file: '5'

services:
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ['-config.file=/etc/loki/${LOKI_CONFIG:-config.yaml}']
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki_data:/loki
    expose:
      - '3100'
    # La imagen es distroless (sin shell): el subcomando `-health` es la unica
    # forma de consultar /ready sin instalar curl en el contenedor.
    healthcheck:
      test: ['CMD', '/usr/bin/loki', '-health', '-health.url=http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    cpus: ${LOKI_CPUS:-1.0}
    pids_limit: 512
    networks:
      - observability

  # Daemon de solo lectura sobre el socket de Docker. Alloy nunca monta
  # /var/run/docker.sock: apuntar al proxy limita el radio de accion a GET sobre
  # /containers, que es lo unico que el pipeline necesita.
  docker-socket-proxy:
    # v0.4.2 (HAProxy 3.2.4) evita la regresion de /version de v0.5.0 con
    # HAProxy 3.4.2. El digest fija la imagen (ADR-0007).
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      # Permitido: lo que llaman discovery.docker y loki.source.docker
      # (GET /containers/json, GET /containers/{id}/json, GET /containers/{id}/logs)
      # y el sondeo /_ping. `discovery.docker` ademas lista redes para resolver
      # los nombres de red de cada contenedor, asi que `NETWORKS` es necesario
      # (solo lectura, no concede ninguna mutacion).
      CONTAINERS: '1'
      INFO: '1'
      NETWORKS: '1'
      PING: '1'
      VERSION: '1'
      EVENTS: '1'
      # Denegado explicitamente. POST=0 deja pasar solo GET/HEAD, asi que el
      # proxy no puede crear, arrancar, parar ni ejecutar nada en el host.
      POST: '0'
      AUTH: '0'
      BUILD: '0'
      COMMIT: '0'
      CONFIGS: '0'
      DISTRIBUTION: '0'
      EXEC: '0'
      GRPC: '0'
      IMAGES: '0'
      NODES: '0'
      PLUGINS: '0'
      SECRETS: '0'
      SERVICES: '0'
      SESSION: '0'
      SWARM: '0'
      SYSTEM: '0'
      TASKS: '0'
      VOLUMES: '0'
      ALLOW_START: '0'
      ALLOW_STOP: '0'
      ALLOW_RESTARTS: '0'
      ALLOW_PAUSE: '0'
      ALLOW_UNPAUSE: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - '2375'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:2375/_ping']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-64m}
    pids_limit: 128
    read_only: true
    # HAProxy crea /run/haproxy.pid al arrancar. Con el rootfs de solo lectura,
    # /run debe ser un tmpfs escribible; /tmp ya lo era.
    tmpfs:
      - /tmp
      - /run:mode=1777
    networks:
      - observability
      - docker-api

  alloy:
    image: grafana/alloy:v1.20.0@sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30
    # La imagen corre como root por defecto; existe el usuario `alloy` (uid 473)
    # con /var/lib/alloy propio. El volumen nombrado hereda ese propietario.
    user: '473:473'
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - '12345'
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${ALLOY_MEM_LIMIT:-256m}
    cpus: ${ALLOY_CPUS:-0.5}
    pids_limit: 256
    networks:
      - observability
      - docker-api

  # Telegraf (Fase 5) recolecta CPU, memoria, red, blkio y estado de los
  # contenedores SIPEG a traves del proxy de solo lectura. No monta el socket
  # de Docker. Prometheus lo scrapea por `metrics`; el contenedor no publica
  # puertos. La salida caduca las series a los 90 s para que una entrada Docker
  # caida no siga presentando datos antiguos como actuales.
  telegraf:
    image: telegraf:1.40.2@sha256:aedc74ac64c623b6e6760545a8ff56a63b99a798bba3d361279a2887642798cf
    # La imagen lee /etc/telegraf/telegraf.conf por defecto. No sobrescribir
    # `command`: el entrypoint espera `telegraf` y `--config` termina en 127.
    # Ejecutar como `telegraf` evita setcap/setpriv con `cap_drop: ALL`.
    user: 'telegraf:telegraf'
    volumes:
      - ./observability/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    expose:
      - '9273'
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${TELEGRAF_MEM_LIMIT:-128m}
    pids_limit: 128
    networks:
      - metrics
      - docker-api

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    command: ['--config.file=/etc/blackbox_exporter/config.yml']
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - '9115'
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${BLACKBOX_EXPORTER_MEM_LIMIT:-64m}
    pids_limit: 128
    networks:
      - metrics
      - observability

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    # La imagen corre como el usuario 472 y crea /var/lib/grafana en el volumen
    # nombrado, asi que no lleva override de `user`.
    environment:
      # Sin acceso anonimo: Grafana es la unica superficie de consulta de logs y
      # expone `log_type=security` (login fallido, 403, 429). El default de la
      # imagen es false, pero se fija explicito para que no dependa de el.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Unico usuario inicial, el ADMIN de abajo. Sin esto cualquier persona podria
      # crear su propia cuenta y ver los logs.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Sin telemetria hacia el exterior del host, igual que en Loki.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Sin default: el de la imagen es `admin`, que es publico. Ademas solo se
      # aplica al inicializar un volumen vacio (ver `.env.example`).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # El default de la imagen es una clave publica y conocida. Firma y cifra
      # datos internos, asi que cambiarlo invalida sesiones y ajustes cifrados:
      # debe permanecer estable entre reinicios.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY is required}
      # SMTP de alertas. En produccion .env.prod define GF_SMTP_ENABLED=true,
      # GF_SMTP_HOST y ALERT_EMAIL_TO. En desarrollo queda deshabilitado y el
      # contact point apunta a un correo ficticio.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-mailpit:1025}
      GF_SMTP_USER: ${MAIL_USER:-}
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:-no-reply@sipeg.local}
      GF_SMTP_FROM_NAME: ${ALERT_EMAIL_FROM_NAME:-SIPEG UTP Alertas}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@sipeg.local}
    ports:
      # Solo loopback para comprobaciones desde el host. En produccion,
      # Cloudflare Tunnel (compose.cloudflare.yaml) alcanza `grafana:3000` por
      # `observability`; Cloudflare termina HTTPS y Access protege el hostname.
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      # Persistencia propia: usuarios, datasource, paneles, alertas y la base
      # SQLite de configuracion. Sin este volumen, recrear el contenedor pierde
      # los paneles provisionados en T10.
      - grafana_data:/var/lib/grafana
      # Solo `datasources/`, `dashboards/` y `alerting/`. Montar
      # /etc/grafana/provisioning entero taparia los directorios de la imagen
      # (access-control, notifiers, plugins).
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Alertas (T10.4). A diferencia de los paneles, NO se releen por sondeo:
      # Grafana las provisiona una vez al arrancar, asi que cambiar rules.yaml
      # exige recrear este contenedor.
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      # Los paneles versionados. Fuera de /var/lib/grafana a proposito: ese path
      # es el home del volumen `grafana_data` y anidar aqui un bind mount de solo
      # lectura mezclaria configuracion y estado.
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-1.0}
    pids_limit: 512
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - '9090'
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    pids_limit: 512
    networks:
      - observability
      - metrics

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - '--path.rootfs=/host'
      # Los contadores de red reales del host los escribe el timer
      # sipeg-host-network-metrics.timer fuera del contenedor. Node Exporter
      # solo los publica; no recibe host networking.
      - '--collector.textfile.directory=/var/lib/sipeg-node-exporter/textfile'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      # El directorio lo crea `deploy/host/install.sh metrics` en produccion.
      - '${HOST_METRICS_DIR:-/var/lib/sipeg-node-exporter/textfile}:/var/lib/sipeg-node-exporter/textfile:ro'
    expose:
      - '9100'
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-64m}
    pids_limit: 128
    networks:
      - observability

  # Alloy solo puede etiquetar los logs de la API si son JSON. En desarrollo
  # compose.dev.yaml activa LOG_PRETTY por defecto (pino-pretty no es JSON), asi
  # que el overlay lo desactiva aqui. En produccion no cambia nada: el logger ya
  # ignora `pretty` cuando NODE_ENV=production.
  #
  # Sin `logging:` a proposito: el servicio hereda el `x-logging` del compose base,
  # y los bloques de un overlay se fusionan en vez de reemplazarse.
  #
  # `networks` se fusiona por nombre con el compose base (verificado con
  # `docker compose config`): la API conserva `sipeg-utp-dev`/`sipeg-utp-prod` y
  # solo se agrega `metrics`. El listener privado de metricas escucha en
  # `0.0.0.0:9464` dentro del contenedor y solo es alcanzable por Prometheus a
  # traves de `metrics`; no se publica al host ni por el tunel, y el puerto de
  # negocio 3000 sigue en la red de aplicacion.
  api:
    environment:
      LOG_PRETTY: 'false'
      METRICS_ENABLED: 'true'
      METRICS_HOST: '0.0.0.0'
      METRICS_PORT: '9464'
    expose:
      - '9464'
    networks:
      - metrics

  # PostgreSQL conserva la red de aplicacion y se agrega a `postgres-metrics`
  # para el exporter. Esa red solo conecta `db` con `postgres-exporter`; no tiene
  # salida externa ni publica puertos.
  db:
    networks:
      - postgres-metrics

  # PostgreSQL Exporter (Fase 4). Se conecta a `db` por `postgres-metrics` con el
  # rol de solo lectura `sipeg_monitor`; Prometheus lo scrapea por `metrics`.
  # `pg_up` distingue la conexion del exporter con la base del `up` del scrape.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER:-sipeg_monitor}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_monitor_password
      PG_EXPORTER_COLLECTION_TIMEOUT: 5s
    secrets:
      - postgres_monitor_password
    expose:
      - '9187'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: ${POSTGRES_EXPORTER_MEM_LIMIT:-64m}
    pids_limit: 128
    networks:
      - metrics
      - postgres-metrics

secrets:
  # Archivo del HOST con la contrasena del rol de monitorizacion. Compose lo
  # monta como secreto en /run/secrets/postgres_monitor_password (modo 0444) y
  # el exporter lo lee con DATA_SOURCE_PASS_FILE. No se versiona: en desarrollo
  # vive bajo .local/ y en produccion bajo /etc/sipeg/secrets con permisos 600.
  postgres_monitor_password:
    file: ${POSTGRES_MONITOR_PASSWORD_FILE:-./.local/secrets/postgres-monitor-password}

volumes:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:

networks:
  # Red propia del stack: los servicios de la aplicacion no la comparten y
  # llegan a los logs por el socket de Docker, no por la red.
  #
  # `internal: true` queda deliberadamente FUERA: Docker no publica ni enruta
  # puertos en una red interna, y Grafana tiene que quedar accesible en
  # 127.0.0.1. Verificado: con `internal: true` un puerto publicado
  # responde con conexion rechazada desde el host. El aislamiento real viene de
  # que aqui no se publica ningun puerto (`expose` es solo interno de la red) y
  # de que los servicios de la aplicacion no estan conectados a esta red.
  observability:
    driver: bridge
  # Redes privadas de recoleccion (Fase 1 del plan de dashboards). `internal:
  # true` deja fuera la puerta de enlace y el enrutado externo: solo sirven para
  # que Prometheus alcance a sus fuentes y para que el proxy Docker sea
  # alcanzable por Alloy y, mas adelante, Telegraf.
  metrics:
    driver: bridge
    internal: true
  # Comunicacion exclusiva entre PostgreSQL y su exporter (Fase 4).
  postgres-metrics:
    driver: bridge
    internal: true
  docker-api:
    driver: bridge
    internal: true
